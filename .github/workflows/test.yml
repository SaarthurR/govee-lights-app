name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'  # the oldest Python the installers accept
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ask.js && node tests/test_feedback.js
      - run: python tests/install_check.py
